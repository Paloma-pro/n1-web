<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmes e Fichas Técnicas</title>
    <link rel="stylesheet" href="exemplo.css">
</head>
<body>
    <div class="container">
        <aside class="lista-filmes">
            <h2>Lista de Filmes</h2>
            <ul id="listaDeFilmes">
                <li data-filme="anora">Anora</li>
                <li data-filme="o-brutalista">O Brutalista</li>
                <li data-filme="duna2">Duna: Parte 2</li>
                </ul>
        </aside>
        <main class="ficha-tecnica">
            <h2>Ficha Técnica</h2>
            <div id="detalhesFilme">
                <p>Selecione um filme na lista para ver sua ficha técnica.</p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
